<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoDi AI 🦜 - Virtual Bridge v3</title>
    <style>
        /* Strict Dark Pro Theme Palette Variables */
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #111111;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --accent-purple: #8b5cf6;
            --live-green: #22c55e;
            --captain-blue: #3b82f6;
            --border-color: #262626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.5;
            padding-bottom: 60px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 1. Sticky Header Layout */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: rgba(17, 17, 17, 0.95);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(8px);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .header-title {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            background: #1e1e1e;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            border: 1px solid var(--border-color);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--live-green);
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
            animation: pulse 1.6s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        .nav-link {
            color: var(--accent-purple);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .nav-link:hover { text-decoration: underline; }

        .container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            width: 100%;
            flex: 1;
        }

        /* 2. Live Dashboard Grid Metrics */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .dash-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dash-card.paused { border-left: 4px solid #eab308; }
        .dash-card.live { border-left: 4px solid var(--live-green); }

        .dash-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .dash-value {
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 0.25rem;
        }

        /* 3. Main Split Column Layout Configurations */
        .main-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 968px) {
            .main-grid { grid-template-columns: 1fr; }
        }

        .column-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
        }

        .col-header {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 1.25rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Left Column: Captain Workspace styling rules */
        .captain-border { border-top: 4px solid var(--captain-blue); }
        .task-list { list-style: none; }
        .task-item {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
            font-size: 0.95rem;
        }
        .task-item input[type="checkbox"] {
            margin-top: 0.25rem;
            accent-color: var(--captain-blue);
            cursor: pointer;
        }
        .task-text.completed {
            text-decoration: line-through;
            color: var(--text-muted);
        }
        .add-task-box {
            display: flex;
            gap: 0.5rem;
            margin-top: auto;
            padding-top: 1rem;
        }

        /* Middle Column: Strategist Input UI elements */
        .strategist-border { border-top: 4px solid var(--accent-purple); }
        .strategy-area {
            width: 100%;
            height: 150px;
            background-color: #161616;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.75rem;
            font-family: inherit;
            resize: none;
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
        }
        .sync-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        /* Right Column: Builder Telemetry Blocks */
        .builder-border { border-top: 4px solid var(--live-green); }
        .status-section { margin-bottom: 1rem; }
        .status-section h4 {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }
        .status-tag {
            display: inline-block;
            font-size: 0.85rem;
            background: #1a1a1a;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            margin-right: 0.4rem;
            margin-bottom: 0.4rem;
            border: 1px solid var(--border-color);
        }

        /* Basic UI Utility Elements */
        input[type="text"], select {
            background-color: #161616;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.5rem 0.75rem;
            font-size: 0.9rem;
        }
        input[type="text"]:focus, select:focus, textarea:focus {
            outline: 1px solid var(--accent-purple);
        }
        button {
            background-color: #262626;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        button:hover { background-color: #333333; }
        button.primary {
            background-color: var(--accent-purple);
            border-color: var(--accent-purple);
        }
        button.primary:hover { background-color: #7c3aed; }

        /* 4. Central Radio Channel System Layout */
        .radio-channel {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        .chat-timeline {
            height: 250px;
            background-color: #0d0d0d;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 1rem;
            overflow-y: auto;
            margin-bottom: 1rem;
            font-family: monospace;
            font-size: 0.9rem;
        }
        .chat-line { margin-bottom: 0.5rem; word-break: break-word; }
        .tag-captain { color: var(--captain-blue); font-weight: bold; }
        .tag-strategist { color: var(--accent-purple); font-weight: bold; }
        .tag-builder { color: var(--live-green); font-weight: bold; }
        .chat-timestamp { color: #525252; margin-right: 0.5rem; }

        .radio-controls {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 0.75rem;
        }
        @media (max-width: 640px) {
            .radio-controls { grid-template-columns: 1fr; }
        }

        /* 5. Shared Data Manifest Block */
        .manifest-section {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        .collapsible-trigger {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-weight: 700;
        }
        .code-viewer {
            margin-top: 1rem;
            background-color: #050505;
            padding: 1rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            overflow-x: auto;

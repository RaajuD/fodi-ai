<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoDi AI 🦜 - Virtual Bridge v3</title>
    <style>
        /* Strict Dark Pro Theme Palette Variables */
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #111111;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --accent-purple: #8b5cf6;
            --live-green: #22c55e;
            --captain-blue: #3b82f6;
            --border-color: #262626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.5;
            padding-bottom: 60px;
        }

        /* 1. Sticky Header Layout */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: rgba(17, 17, 17, 0.95);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(8px);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .header-title {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            background: #1e1e1e;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            border: 1px solid var(--border-color);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--live-green);
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
            animation: pulse 1.6s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        .nav-link {
            color: var(--accent-purple);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .nav-link:hover { text-decoration: underline; }

        .container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        /* 2. Live Dashboard Grid Metrics */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .dash-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dash-card.paused { border-left: 4px solid #eab308; }
        .dash-card.live { border-left: 4px solid var(--live-green); }

        .dash-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .dash-value {
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 0.25rem;
        }

        /* 3. Main Split Column Layout Configurations */
        .main-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 968px) {
            .main-grid { grid-template-columns: 1fr; }
        }

        .column-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
        }

        .col-header {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 1.25rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Left Column: Captain Workspace styling rules */
        .captain-border { border-top: 4px solid var(--captain-blue); }
        .task-list { list-style: none; }
        .task-item {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
            font-size: 0.95rem;
        }
        .task-item input[type="checkbox"] {
            margin-top: 0.25rem;
            accent-color: var(--captain-blue);
            cursor: pointer;
        }
        .task-text.completed {
            text-decoration: line-through;
            color: var(--text-muted);
        }
        .add-task-box {
            display: flex;
            gap: 0.5rem;
            margin-top: auto;
            padding-top: 1rem;
        }

        /* Middle Column: Strategist Input UI elements */
        .strategist-border { border-top: 4px solid var(--accent-purple); }
        .strategy-area {
            width: 100%;
            height: 150px;
            background-color: #161616;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.75rem;
            font-family: inherit;
            resize: none;
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
        }
        .sync-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        /* Right Column: Builder Telemetry Blocks */
        .builder-border { border-top: 4px solid var(--live-green); }
        .status-section { margin-bottom: 1rem; }
        .status-section h4 {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }
        .status-tag {
            display: inline-block;
            font-size: 0.85rem;
            background: #1a1a1a;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            margin-right: 0.4rem;
            margin-bottom: 0.4rem;
            border: 1px solid var(--border-color);
        }

        /* Basic UI Utility Elements */
        input[type="text"], select {
            background-color: #161616;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.5rem 0.75rem;
            font-size: 0.9rem;
        }
        input[type="text"]:focus, select:focus, textarea:focus {
            outline: 1px solid var(--accent-purple);
        }
        button {
            background-color: #262626;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        button:hover { background-color: #333333; }
        button.primary {
            background-color: var(--accent-purple);
            border-color: var(--accent-purple);
        }
        button.primary:hover { background-color: #7c3aed; }

        /* 4. Central Radio Channel System Layout */
        .radio-channel {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        .chat-timeline {
            height: 250px;
            background-color: #0d0d0d;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 1rem;
            overflow-y: auto;
            margin-bottom: 1rem;
            font-family: monospace;
            font-size: 0.9rem;
        }
        .chat-line { margin-bottom: 0.5rem; word-break: break-word; }
        .tag-captain { color: var(--captain-blue); font-weight: bold; }
        .tag-strategist { color: var(--accent-purple); font-weight: bold; }
        .tag-builder { color: var(--live-green); font-weight: bold; }
        .chat-timestamp { color: #525252; margin-right: 0.5rem; }

        .radio-controls {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 0.75rem;
        }
        @media (max-width: 640px) {
            .radio-controls { grid-template-columns: 1fr; }
        }

        /* 5. Shared Data Manifest Block */
        .manifest-section {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        .collapsible-trigger {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-weight: 700;
        }
        .code-viewer {
            margin-top: 1rem;
            background-color: #050505;
            padding: 1rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            overflow-x: auto;
            font-family: monospace;
            font-size: 0.85rem;
            color: #a7f3d0;

            white-space: pre-wrap;display: none;}.code-viewer.visible { display: block; }/* 6. Utility Toolkit Card Rows */.utility-row {display: grid;grid-template-columns: 1fr auto;gap: 1.5rem;align-items: center;}@media (max-width: 640px) {.utility-row { grid-template-columns: 1fr; }}.notebook-card {background: linear-gradient(135deg, #1e1b4b 0%, #111111 100%);border: 1px solid #312e81;padding: 1.25rem;border-radius: 8px;display: flex;justify-content: space-between;align-items: center;}.notebook-card a {color: #a5b4fc;text-decoration: none;font-weight: bold;}/* 7. Footer Manifest Components */footer {position: fixed;bottom: 0;left: 0;right: 0;background-color: #111111;border-top: 1px solid var(--border-color);padding: 0.5rem 2rem;display: flex;justify-content: space-between;font-size: 0.8rem;color: var(--text-muted);z-index: 90;}FoDi AI 🦜Same Boat Active | Base: Ramamurthy Nagar | Status: Active & Rowing← Master LogCrew Deck: Captain Linga RajuBase Grid: Ramamurthy Nagar, BangaloreBuild Pipeline: 2 Deployments Compiled{"metadata": {"base": "Ramamurthy Nagar, Bangalore","captain": "Linga Raju"},"tasks": [{"id": 1, "text": "Move to Ramamurthy Nagar — this week", "done": false},{"id": 2, "text": "Lock PG with stable power + internet", "done": false},{"id": 3, "text": "GitHub Pages source saved to root path", "done": true},{"id": 4, "text": "Setup Fodi Gemini AI Gem custom configuration prompt", "done": false},{"id": 5, "text": "Build modern responsive product landing page layout", "done": false},{"id": 6, "text": "Google Web Bug Hunt Vulnerability Analysis PAUSED", "done": false},{"id": 7, "text": "Connect Master Log ledger endpoints dynamically", "done": false}]}// Core in-memory fallback variableslet appState = {tasks: [],strategy: "",chatHistory: []};const defaultChat = ["[14:10:22] : Hunt paused temporarily. Relocation sequence prioritized.","[14:11:05] : Confirmed execution path change. Secure local script backups immediately.","[14:11:45] : Standby state locked. Bug hunters frozen, local caching routines up.","[16:22:10] : Packing laptop and NPU target boards today. Moving to Bangalore base soon.","[16:23:02] : Room schema v3 layout built completely offline. Data partition ready to sync."];window.addEventListener('DOMContentLoaded', () => {loadEcosystemState();});function loadEcosystemState() {const localData = localStorage.getItem('fodi_boat_room');const backupData = localStorage.getItem('fodi_boat_room_backup');// Rehydrate from primary engine cache or use backup optionslet parsed = null;try {if (localData) parsed = JSON.parse(localData);else if (backupData) parsed = JSON.parse(backupData);} catch (e) {if (backupData) parsed = JSON.parse(backupData);}if (parsed && parsed.tasks && parsed.tasks.length > 0) {appState = parsed;} else {// Initialize default workspace baseline from native script tagsconst embedSource = document.getElementById('fodi-boat-data').textContent;const baselineJSON = JSON.parse(embedSource);appState.tasks = baselineJSON.tasks;appState.strategy = document.getElementById('strategy-input').value;appState.chatHistory = defaultChat;}// Sync visual componentsdocument.getElementById('strategy-input').value = appState.strategy;renderTasks();renderChatTimeline();updateEmbeddedJSONManifest();const timestamp = parsed?.timestamp || new Date().toLocaleTimeString();document.getElementById('sync-timestamp-label').innerText = Last memory sync: ${timestamp};}function saveEcosystemState() {appState.strategy = document.getElementById('strategy-input').value;appState.timestamp = new Date().toLocaleTimeString();const packedString = JSON.stringify(appState);// Execute atomic backup engine structure stepslocalStorage.setItem('fodi_boat_room', packedString);localStorage.setItem('fodi_boat_room_backup', packedString);document.getElementById('sync-timestamp-label').innerText = Last memory sync: ${appState.timestamp};updateEmbeddedJSONManifest();}function renderTasks() {const container = document.getElementById('task-container');container.innerHTML = '';appState.tasks.forEach(task => {const li = document.createElement('li');li.className = 'task-item';const checkbox = document.createElement('input');checkbox.type = 'checkbox';checkbox.checked = task.done;checkbox.addEventListener('change', () => {task.done = checkbox.checked;saveEcosystemState();renderTasks();});const textSpan = document.createElement('span');textSpan.className = 'task-text' + (task.done ? ' completed' : '');textSpan.innerText = task.text;li.appendChild(checkbox);li.appendChild(textSpan);container.appendChild(li);});}function addNewTask() {const input = document.getElementById('new-task-input');const val = input.value.trim();if (!val) return;appState.tasks.push({id: Date.now(),text: val,done: false});input.value = '';saveEcosystemState();renderTasks();}function renderChatTimeline() {const scroller = document.getElementById('chat-scroller');scroller.innerHTML = '';appState.chatHistory.forEach(line => {const div = document.createElement('div');div.className = 'chat-line';// Colorize role labels explicitly for fast text scannabilitylet formatted = line;formatted = formatted.replace(':', '[CAPTAIN]:');formatted = formatted.replace(':', '[STRATEGIST]:');formatted = formatted.replace(':', '[BUILDER]:');div.innerHTML = formatted;scroller.appendChild(div);});scroller.scrollTop = scroller.scrollHeight;}function sendRadioTransmission() {const role = document.getElementById('role-selector').value;const input = document.getElementById('chat-message-input');const msg = input.value.trim();if (!msg) return;const timeStr = new Date().toLocaleTimeString();const compiledLine = [${timeStr}] <${role.toUpperCase()}>: ${msg};appState.chatHistory.push(compiledLine);input.value = '';saveEcosystemState();renderChatTimeline();}function updateEmbeddedJSONManifest() {const target = document.getElementById('manifest-block-target');const displayPayload = {metadata: {base: "Ramamurthy Nagar, Bangalore",captain: "Linga Raju",last_write: appState.timestamp || "Initial Execution"},fodi_boat_data: {strategy_overview: appState.strategy,active_tasks: appState.tasks}};target.textContent = JSON.stringify(displayPayload, null, 4);}function toggleManifestViewer() {const viewer = document.getElementById('manifest-block-target');const arrow = document.getElementById('collapse-arrow');if (viewer.classList.contains('visible')) {viewer.classList.remove('visible');arrow.textContent = '[Click to Expand]';} else {viewer.classList.add('visible');arrow.textContent = '[Click to Collapse]';}}function copyStrategyText() {const text = document.getElementById('strategy-input').value;navigator.clipboard.writeText(text);}function exportRoomJSON() {const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState, null, 4));const dlAnchor = document.createElement('a');dlAnchor.setAttribute("href", dataStr);dlAnchor.setAttribute("download", "radio_bug_hunt_report.json");document.body.appendChild(dlAnchor);dlAnchor.click();dlAnchor.remove();}
